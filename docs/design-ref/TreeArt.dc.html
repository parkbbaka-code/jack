<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#05101F">
  <div style="{{ shift }}">
    <img src="assets/canopy.webp" alt="" style="position:absolute;left:0;top:0;width:390px;height:520px;object-fit:cover;object-position:50% 40%;display:block;-webkit-mask-image:linear-gradient(180deg,#000 0px,#000 380px,transparent 520px);mask-image:linear-gradient(180deg,#000 0px,#000 380px,transparent 520px)">
    <img src="assets/branch.webp" alt="" style="position:absolute;left:0;top:430px;width:390px;height:520px;object-fit:cover;object-position:50% 50%;display:block;-webkit-mask-image:linear-gradient(180deg,transparent 0px,#000 130px,#000 400px,transparent 520px);mask-image:linear-gradient(180deg,transparent 0px,#000 130px,#000 400px,transparent 520px)">
    <img src="assets/trunk.webp" alt="" style="position:absolute;left:0;top:850px;width:390px;height:650px;object-fit:cover;object-position:50% 50%;display:block;-webkit-mask-image:linear-gradient(180deg,transparent 0px,#000 170px);mask-image:linear-gradient(180deg,transparent 0px,#000 170px)">


  </div>
  <div style="position:absolute;left:0;top:0;width:390px;height:844px;background:radial-gradient(78% 58% at 50% 40%,rgba(0,0,0,0) 42%,rgba(2,6,14,0.6) 100%);pointer-events:none"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;offsetY&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:330,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:656,&quot;step&quot;:2}}">
class Component extends DCLogic {
  renderVals() {
    const y = Number(this.props.offsetY);
    const off = Number.isFinite(y) ? y : 330;
    return {
      shift: { position: 'absolute', left: 0, top: (-off) + 'px', width: '390px', height: '1500px' }
    };
  }
}

</script>
</body>
</html>
