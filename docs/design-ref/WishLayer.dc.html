<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:0;top:0;width:390px;height:844px;pointer-events:none">
  <sc-for list="{{ items }}" as="w" hint-placeholder-count="12">
    <div style="{{ w.pos }}">
      <sc-if value="{{ w.paper }}" hint-placeholder-val="{{ true }}">
        <img src="assets/paper.png" alt="" style="display:block;width:26px;transform-origin:50% 4%;animation:sway 7s ease-in-out infinite;filter:drop-shadow(0 0 7px rgba(246,242,233,0.3)) drop-shadow(0 3px 6px rgba(0,0,0,0.6))">
      </sc-if>
      <sc-if value="{{ w.fine }}" hint-placeholder-val="{{ false }}">
        <img src="assets/fine-paper.png" alt="" style="display:block;width:29px;transform-origin:50% 4%;animation:sway 8.5s ease-in-out infinite;filter:drop-shadow(0 0 9px rgba(239,214,150,0.42)) drop-shadow(0 3px 6px rgba(0,0,0,0.6))">
      </sc-if>
      <sc-if value="{{ w.ribbon }}" hint-placeholder-val="{{ false }}">
        <img src="{{ w.ribbonSrc }}" alt="" style="display:block;width:30px;transform-origin:50% 6%;animation:swayR 5.5s ease-in-out infinite;filter:drop-shadow(0 3px 7px rgba(0,0,0,0.6))">
      </sc-if>
      <sc-if value="{{ w.lantern }}" hint-placeholder-val="{{ false }}">
        <img src="assets/lantern.png" alt="" style="display:block;width:40px;transform-origin:50% 3%;animation:sway 9s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(232,194,103,0.62)) drop-shadow(0 0 44px rgba(198,162,78,0.34))">
      </sc-if>
      <sc-if value="{{ w.gold }}" hint-placeholder-val="{{ false }}">
        <img src="assets/paper.png" alt="" style="display:block;width:26px;transform-origin:50% 4%;animation:sway 7.5s ease-in-out infinite;filter:sepia(1) saturate(3) hue-rotate(-12deg) brightness(1.04) drop-shadow(0 0 13px rgba(198,162,78,0.75))">
      </sc-if>
      <sc-if value="{{ w.faded }}" hint-placeholder-val="{{ false }}">
        <img src="assets/paper.png" alt="" style="display:block;width:23px;opacity:0.32;filter:grayscale(0.45) brightness(0.78);transform:rotate(74deg)">
      </sc-if>
      <sc-if value="{{ w.stone }}" hint-placeholder-val="{{ false }}">
        <img src="assets/stone.png" alt="" style="display:block;width:34px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6))">
      </sc-if>
      <sc-if value="{{ w.cairn }}" hint-placeholder-val="{{ false }}">
        <img src="assets/stone-cairn.png" alt="" style="display:block;width:52px;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.6))">
      </sc-if>
      <sc-if value="{{ w.back }}" hint-placeholder-val="{{ false }}">
        <img src="assets/paper.png" alt="" style="display:block;width:26px;transform-origin:50% 4%;animation:sway 6.5s ease-in-out infinite;filter:grayscale(0.8) brightness(0.6) drop-shadow(0 3px 6px rgba(0,0,0,0.6))">
      </sc-if>
    </div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{pos:object,paper?:boolean,fine?:boolean,ribbon?:boolean,ribbonSrc?:string,lantern?:boolean,gold?:boolean,faded?:boolean,stone?:boolean,cairn?:boolean,back?:boolean}&gt;&quot;}}"></script>
</body>
</html>
